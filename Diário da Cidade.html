<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário da Cidade - Login</title>
</head>
<!-- Usei um tom de cinza bem clarinho para o fundo não cansar os olhos -->
<body bgcolor="#F4F4F9" text="#333333">

    <!-- Tabela Principal para organizar a página inteira -->
    <table border="0" width="100%" height="600px" align="center" cellpadding="0" cellspacing="0">
        
        <!-- Linha do Cabeçalho -->
        <tr>
            <td align="center" bgcolor="" height="100px">
                    <h1>DIÁRIO DA CIDADE</h1>
                    <p><i>Sua cidade, sua voz.</i></p>
            </td>
        </tr>

        <!-- Linha do Espaçamento -->
        <tr><td height="50px"></td></tr>

        <!-- Linha do Conteúdo (Login) -->
        <tr>
            <td align="center" valign="top">
                
                <!-- Tabela do Formulário de Login -->
                <table border="0" width="350px" bgcolor="white" cellpadding="30" cellspacing="0" style="border: 1px solid #CCCCCC;">
                    <tr>
                        <td align="center">
                            <h2><mark>Acesse sua Conta</mark></h2>
                            <br>

                            <label><b>E-mail:</b></label><br>
                            <input type="email" size="30"><br><br>

                            <label><b>Senha:</b></label><br>
                            <input type="password" size="30"><br><br>

                            
                            <button onclick="prompt('Digite a senha:') === '1234' ? window.location.href = 'Principal.html' : alert('Incorreto')">Entrar</button>
                            <br><br>

                            <hr> <!-- Linha horizontal para separar -->
                            
                            <p>Ainda não tem acesso?</p>
                            <a href="cadastrar.html">
                                <button>Criar uma conta</button>
                            </a>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>

        <!-- Linha do Rodapé -->
        <tr>
            <td align="center" bgcolor="#F4F4F9">
                <br>
                <u>Termos de Uso</u> | <u>Privacidade</u>
                <p><small><b>© 2026 Diário da Cidade - Oficial</b></small></p>
            </td>
        </tr>

    </table>

</body>
</html>
