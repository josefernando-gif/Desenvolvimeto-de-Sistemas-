<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body bgcolor="darkgray">

    <h1 style="color: yellow;">Criar Conta</h1>

    <form id="cadastroForm">

        <label><b>Nome Completo:</b></label>
        <input type="text" required>
        <br><br>

        <label><b>E-mail:</b></label>
        <input type="email" id="email" required>
        <br><br>

        <label><b>Senha:</b></label>
        <input type="password" id="senha1" required>
        <br><br>

        <label><b>Confirme a Senha:</b></label>
        <input type="password" id="senha2" required>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <script>

        document.getElementById("cadastroForm").addEventListener("submit", function(event){

            event.preventDefault();

            let email = document.getElementById("email").value;
            let senha1 = document.getElementById("senha1").value;
            let senha2 = document.getElementById("senha2").value;

            if(senha1 === senha2){

                localStorage.setItem("email", email);
                localStorage.setItem("senha", senha1);

                alert("Cadastro realizado com sucesso!");

                window.location.href = "Diário da Cidade.html";

            } else {

                alert("As senhas não correspondem!");

            }

        });

    </script>

</body>
</html>
